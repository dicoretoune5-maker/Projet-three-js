<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC - Connexion</title>
    <link rel="stylesheet" href="page_connexion.css">
</head>

<body>

    <!-- L'effet de lumière qui suivra la souris -->
    <div id="spotlight"></div>

    <div class="login-container">
        <header class="logo-container">
            <img src="logo DC avec arrière-plan supprimé.png" alt="Logo DC" class="logo">
        </header>

        <!-- Formulaire de Connexion / Inscription -->
        <div class="form-box">
            <div class="tabs">
                <button id="login-tab" class="tab-btn active">Connexion</button>
                <button id="signup-tab" class="tab-btn">Inscription</button>
            </div>

            <form id="auth-form">
                <h2 id="form-title">Bon retour, Héros</h2>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Entrez votre email" required>
                </div>

                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div id="signup-fields" style="display: none;">
                    <div class="input-group">
                        <label for="username">Nom d'utilisateur</label>
                        <input type="text" id="username" placeholder="Pseudo de héros">
                    </div>
                </div>

                <button type="submit" class="btn-action">Continuer l'aventure</button>
            </form>
        </div>

        <a href="page_acceuil.html" class="back-link">← Retour à l'accueil</a>
    </div>

    <script src="page_connexion.js"></script>
</body>

</html>
