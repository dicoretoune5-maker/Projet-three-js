<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC - Find The Hero</title>
    <link rel="stylesheet" href="acceuil.css">
</head>

<body>

    <div class="slide-container">
        <!-- Section Logo -->
        <header class="logo-container">
            <!-- Remplacez "logo-dc.png" par le chemin de votre logo -->
            <img src="logo DC avec arrière-plan supprimé.png" alt="Logo DC" class="logo">
        </header>

        <!-- Section Titre et Bouton -->
        <main class="content">
            <h1 class="title">FIND THE HERO</h1>
            <a href="page_connexion.html" class="btn-play">Let's play</a>
        </main>

        <!-- Section des Images (3 Groupes) -->
        <div class="hero-groups">

            <!-- Groupe 1 : Gauche (Harley Quinn) -->
            <div class="group left">
                <img src="harley Q avec arrière-plan supprimé.png" alt="Harley Quinn" class="hero-img">
            </div>

            <!-- Groupe 2 : Centre (Justice League) -->
            <div class="group center">
                <img src="perso DC avec arrière-plan supprimé.png" alt="Justice League" class="hero-img">
            </div>

            <!-- Groupe 3 : Droite (Héros Comics) -->
            <div class="group right">
                <img src="personnage dc 2 avec arrière-plan supprimé.png" alt="Comics Heroes" class="hero-img">
            </div>

        </div>
    </div>

    <script src="acceuil.js"></script>
</body>

</html>
