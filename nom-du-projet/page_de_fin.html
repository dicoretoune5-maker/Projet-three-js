<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC - Victoire !</title>
    <link rel="stylesheet" href="page_de_fin.css">
</head>

<body>

    <!-- Curseur personnalisé qui suit la souris -->
    <div id="custom-cursor"></div>

    <div class="victory-container">

        <div class="victory-card">
            <!-- Le Badge Doré -->
            <div class="badge-wrapper">
                <div class="badge-glow"></div>
                <div class="badge">
                    <span class="dc-text">DC</span>
                </div>
            </div>

            <div class="victory-content">
                <p class="congrats">Félicitations !</p>
                <h1>TU ES UN VRAI HÉROS DC !</h1>
                <p class="summary">Tu as retrouvé les 20 objets de l'univers DC Comics et prouvé ta valeur.</p>

                <div class="badge-tag">
                    <span class="icon">🏆</span> Badge "Team DC" débloqué
                </div>

                <button class="btn-share" onclick="partager()">Partager mon badge</button>
            </div>
        </div>

        <a href="page_acceuil.html" class="home-link">Retour au menu principal</a>
    </div>

    <script src="page_de_fin.js"></script>
</body>

</html>
