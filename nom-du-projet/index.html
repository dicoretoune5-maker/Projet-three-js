<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find the Hero - DC</title>
  <link rel="stylesheet" href="popup_reponse.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app"></div>

  <div id="game-popup" class="overlay">
    <div class="quiz-card">

      <button id="close-popup" class="close-btn">&times;</button>

      <div class="object-preview" id="mini-viewer"></div>

      <div class="quiz-content">
        <p class="subtitle">À quel héros appartient cet objet ?</p>
        <h2 id="popup-title">Qui utilise cet objet ?</h2>

        <div class="input-container">
          <input type="text" id="hero-input" placeholder="Entrez le nom du héros..." autocomplete="off">
          <div class="input-glow"></div>
        </div>

        <p class="hint">Appuie sur Entrée pour valider</p>
        <button id="btn-valider" style="display: none;">Valider</button>
        <div id="feedback-msg" class="feedback"></div>
      </div>

    </div>
  </div>

  <script type="module" src="/src/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('hero-input');
      const btn = document.getElementById('btn-valider');

      input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          btn.click();
        }
      });
    });
  </script>
</body>

</html>
