<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Game - Univers 3D</title>
    <link rel="stylesheet" href="popup_reponse.css">
</head>

<body>

    <!-- Fond de la Galaxie (Simulation de l'univers 3D) -->
    <div class="galaxy-bg">
        <p class="instruction">Essayez de deviner les héros qui se cache derrière les objets ! </p>

        <!-- Objets de test dans l'univers -->
        <div class="game-object" onclick="ouvrirEnigme('batarang', 'Batman', 'batarang.png')">
            <img src="batarang-icon.png" alt="Objet Mystère">
            <span>Objet 1</span>
        </div>

        <div class="game-object" style="top: 60%; left: 70%;"
            onclick="ouvrirEnigme('lasso', 'Wonder Woman', 'lasso.png')">
            <img src="lasso-icon.png" alt="Objet Mystère">
            <span>Objet 2</span>
        </div>
    </div>

    <!-- LE POP-UP D'ÉNIGME (Caché par défaut) -->
    <div id="quiz-overlay" class="overlay">
        <div class="quiz-card">

            <button class="close-btn" onclick="fermerEnigme()">&times;</button>

            <div class="object-preview">
                <!-- L'image de l'objet s'affichera ici -->
                <img id="quiz-img" src="" alt="Objet">
            </div>

            <div class="quiz-content">
                <p class="subtitle">À quel héros appartient cet objet ?</p>
                <h2 id="quiz-question">Qui utilise ce batarang ?</h2>

                <div class="input-container">
                    <input type="text" id="hero-guess" placeholder="Entrez le nom du héros..." autocomplete="off">
                    <div class="input-glow"></div>
                </div>

                <p class="hint">Appuie sur Entrée pour valider</p>

                <div id="feedback" class="feedback"></div>
            </div>

        </div>
    </div>

    <script src="popup_reponse.js"></script>
</body>

</html>
